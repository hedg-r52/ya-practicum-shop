spring:
  application:
    name: 'ya-practicum-shop'
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/shop
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30s
      max-life-time: 10m
      validation-query: SELECT 1
  datasource:
    url: jdbc:postgresql://localhost:5432/shop
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
    default-schema: public
    url: jdbc:postgresql://localhost:5432/shop
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    enabled: true
  cache:
    type: redis
#  webflux:
#    client:
#      response-timeout: 10s
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/master
            token-uri: http://localhost:8180/realms/master/protocol/openid-connect/token
        registration:
          shop:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: shop
            client-secret: KIroqyQolGgXQsUVBF8QiKWPtB8cubyM
            client-authentication-method: client_secret_post
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    org.springframework.web.reactive.function.client.ExchangeFilterFunctions: TRACE
    org.springframework.security.oauth2.client.reactive.ReactiveOAuth2AuthorizedClientManager: TRACE
payments-service-uri: http://localhost:8090