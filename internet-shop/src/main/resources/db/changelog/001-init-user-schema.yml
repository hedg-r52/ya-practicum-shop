databaseChangeLog:
  - changeSet:
      id: create_table_users
      author: hedg-r52
      changes:
        - createTable:
            catalogName: shop
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: login
                  type: varchar
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: date
                  constraints:
                    nullable: false
            tableName: users
            schemaName: public
      rollback:
        - dropTable:
            tableName: users